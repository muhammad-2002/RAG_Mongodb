[project]
name = "rag-mongo"
version = "0.1.0"
description = "RAG API using MongoDB and Gemini"
readme = "README.md"
authors = [
    { name = "Muhammad", email = "masumbilla10104@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymongo",
    "python-dotenv",
    "google-genai",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.rag_mongo.main:app"